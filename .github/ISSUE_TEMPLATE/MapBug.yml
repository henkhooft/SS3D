name: Map editor bug
description: Something in the map editor, or a map you built, is broken or confusing.
labels: [bug, map-authoring]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting! Questions and ideas belong in [Discussions](https://github.com/henkhooft/SS3D/discussions); what's planned is on the [roadmap](https://github.com/henkhooft/SS3D/blob/develop/ROADMAP.md).
  - type: input
    id: version
    attributes:
      label: Game version
      description: Shown as "build …" in the lobby's Server Info panel, or in the name of the release zip you downloaded. In the Editor, give the commit you're on.
      placeholder: 0.1.1-dev.12+5da58b9
    validations:
      required: true
  - type: dropdown
    id: build
    attributes:
      label: How were you playing?
      options:
        - Release download (Windows)
        - Release download (Linux)
        - Unity Editor
    validations:
      required: true
  - type: dropdown
    id: role
    attributes:
      label: Were you hosting or joining?
      options:
        - Hosting (or playing alone)
        - Joined someone else's server
        - Dedicated server
        - Not sure
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open the map editor (B) and …
        2. …
    validations:
      required: true
  - type: textarea
    id: extra
    attributes:
      label: Logs, screenshots and map file
      description: Drag files in here. Logs are in the `Game/Logs/` folder of the release download. Attach your map too, via Save → Save & Export (GitHub accepts the `.zip`).
